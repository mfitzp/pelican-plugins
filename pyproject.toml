[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pelican_plugins"
version = "0.1.4"
description = "A collection of plugins for the Pelican static site generator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Martin", email = "martin@mfitzp.com" }]
keywords = ["pelican", "plugins", "static-site-generator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pelican",
    "Framework :: Pelican :: Plugins",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["pelican"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["pelican_plugins"]
